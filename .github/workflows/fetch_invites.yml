name: 定时获取邀请码 + 部署 Pages

on:
  schedule:
    # 每 10 分钟运行一次
    - cron: '*/10 * * * *'
  workflow_dispatch:  # 支持手动触发

# 确保只有一个实例在运行
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  fetch-invites:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装依赖
        run: pip install requests

      - name: 获取邀请码并生成 API 数据
        env:
          CLAW_SESS: ${{ secrets.CLAW_SESS }}
          API_TOKEN: ${{ secrets.API_TOKEN }}
        run: python generate_api.py

      - name: 提交更新到仓库
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add invites_api*.json invites_report.md docs/
          git diff --staged --quiet || (git commit -m "chore: 更新邀请码数据 $(date '+%Y-%m-%d %H:%M')" && git push)

      - name: 上传 Pages 构件
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/

      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4


